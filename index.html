<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Word Bloom — Colourful Word Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <section class="hero" aria-labelledby="page-title">
      <div class="eyebrow"><span class="sparkle">✦</span> A little inspiration generator</div>
      <h1 id="page-title">Find your new favourite<br /><em>favourite</em> word.</h1>
      <p class="intro">Tap the button and let a bright new word blossom.</p>
    </section>

    <section class="generator-card" aria-live="polite">
      <div class="card-topline">
        <span id="wordCategory">NOUN</span>
        <button class="icon-button" id="copyButton" type="button" aria-label="Copy generated word" title="Copy word">↗</button>
      </div>
      <div class="word-stage">
        <div class="word-orbit orbit-one"></div>
        <div class="word-orbit orbit-two"></div>
        <span class="word" id="wordDisplay">sonder</span>
      </div>
      <p class="definition" id="definitionDisplay">the realisation that every passerby has a life as vivid and complex as your own</p>
      <button class="generate-button" id="generateButton" type="button">
        <span>Generate a word</span>
        <span class="button-arrow">→</span>
      </button>
      <p class="status" id="statusMessage" role="status"></p>
    </section>

    <footer class="footer-note"><span class="dot"></span> Words worth keeping</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
